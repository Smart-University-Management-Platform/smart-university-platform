version: '3.8'

services:
  # Shared Database
  postgres:
    image: postgres:16-alpine
    container_name: smart-uni-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smart_uni_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-uni-net

  # Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: smart-uni-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - smart-uni-net

  # Cache
  redis:
    image: redis:7-alpine
    container_name: smart-uni-redis
    ports:
      - "6379:6379"
    networks:
      - smart-uni-net

  # Distributed Tracing (Optional but recommended)
  zipkin:
    image: openzipkin/zipkin
    container_name: smart-uni-zipkin
    ports:
      - "9411:9411"
    networks:
      - smart-uni-net

networks:
  smart-uni-net:
    driver: bridge

volumes:
  postgres_data:
