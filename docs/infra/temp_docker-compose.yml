version: "3.9"
name: sup-infra

services:
  postgres:
    image: postgres:16
    container_name: sup_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sup_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    container_name: sup_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:


